version: '3'

tasks:

  up:
    desc: docker compose up
    summary: |
      Running docker compose up on one or more specified environment
      Compose file can be found in each folder
    requires:
      vars:
        - name: env
    cmd: "{{.TASKFILE_DIR}}/compose.sh {{.env}}"

  down:
    desc: docker compose down
    summary: |
      Running docker compose down on one or more specified environment
      Compose file can be found in each folder
    requires:
      vars:
        - name: env
    cmd: "{{.TASKFILE_DIR}}/compose.sh {{.env}} -d"

  rm:
    desc: docker compose down --rmi all
    summary: |
      Running docker compose down --rmi all on one or more specified environment
      Compose file can be found in each folder
    requires:
      vars:
        - name: env
    cmd: "{{.TASKFILE_DIR}}/compose.sh {{.env}} -de"

  restart:
    desc: docker compose restart
    summary: |
      Running docker compose restart on one or more specified environment
      Compose file can be found in each folder
    requires:
      vars:
        - name: env
    cmd: "{{.TASKFILE_DIR}}/compose.sh {{.env}} -r"

  pull:
    desc: docker compose pull
    summary: |
      Running docker compose pull on one or more specified environment
      Compose file can be found in each folder
    requires:
      vars:
        - name: env
    cmd: "{{.TASKFILE_DIR}}/compose.sh {{.env}} -p"

  update:
    desc: update compose
    summary: |
      Running docker compose pull, docker compose down and docker compose pull
      Compose file can be found in each folder
    requires:
      vars:
        - name: env
    cmds: 
      - "{{.TASKFILE_DIR}}/compose.sh {{.env}} -p"
      - "{{.TASKFILE_DIR}}/compose.sh {{.env}} -d"
      - "{{.TASKFILE_DIR}}/compose.sh {{.env}}"

  backup:
    desc: Backing up compose volumes
    summary: |
      Hello
    cmd: "{{.TASKFILE_DIR}}/backup.sh"
